name: Vertical AI
group: applications
color: oklch(0.62 0.20 216)
icon: Buildings
intro: >-
  AI purpose-built for specific industries and business functions: healthcare scribes like Abridge and Nabla, legal AI like Harvey AI and Spellbook, finance platforms like AlphaSense and Rogo, education tutors like Khanmigo, sales agents like Clay and Gong, and customer support agents like Sierra and Decagon. These handle domain compliance and professional workflows, not generic LLM wrapping.
