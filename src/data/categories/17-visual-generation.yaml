intro: >-
  AI image and video generators: text-to-image products like Midjourney, Adobe Firefly, and Ideogram, editing and inpainting with Krea and Magnific, text-to-video like Sora, Runway, and Kling, and avatar generation with HeyGen and Synthesia. The underlying model weights live in Foundation Models.
