name: Multimodal & Perception
group: core-ai
color: oklch(0.62 0.20 43)
icon: Eye
intro: >-
  Models that see and hear: vision-language models like InternVL and LLaVA, computer vision systems like SAM and Detectron2, and speech recognition engines like Whisper and Deepgram. Pure perception lives here; generative image and audio model weights belong to Foundation Models.
