name: Coding Agents
group: coding
color: oklch(0.62 0.20 0)
icon: Code
intro: >-
  AI coding agents that write, review, and ship code: autonomous engineers like Devin, CLI agents like Claude Code and Aider, AI-first IDEs like Cursor and Devin Desktop, and editor extensions like GitHub Copilot. To choose one, start from where the agent should run. Extensions fit into your existing editor, AI IDEs replace it, CLI agents work in the terminal with full repo access, and hosted autonomous agents take on whole tasks in the cloud. The most active corner of the AI landscape.
