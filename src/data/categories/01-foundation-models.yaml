name: Foundation Models
group: core-ai
color: oklch(0.62 0.20 202)
icon: Brain
intro: >-
  The AI model families themselves: language models like Claude, GPT, Gemini, Qwen, and DeepSeek, coding models like Codex and Devstral, plus embedding, image, video, and speech model weights. Reasoning is now a mode inside each family, not a family of its own. One card per family; versions and tiers live inside each card, and the products built on these models live in their own categories.
